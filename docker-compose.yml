services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
    depends_on:
      - mysql
      - redis
    networks: [app-net]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on: [app]
    networks: [app-net]
    restart: unless-stopped

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: php artisan queue:work redis --queue=parsing --tries=3 --backoff=10,60,300
    volumes:
      - ./backend:/var/www/html
    depends_on: [mysql, redis]
    networks: [app-net]
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: yandex_reviews
      MYSQL_USER: yandex_reviews
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks: [app-net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks: [app-net]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_PROXY_TARGET=http://nginx
    command: npm run dev -- --host
    networks: [app-net]
    restart: unless-stopped

networks:
  app-net:

volumes:
  db-data:
