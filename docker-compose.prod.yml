services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file: ./backend/.env
    volumes:
      - storage-data:/var/www/html/storage
    depends_on: [mysql, redis]
    networks: [app-net]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - storage-data:/var/www/html/storage:ro
    depends_on: [app]
    networks:
      - app-net
      - caddy-net
    restart: unless-stopped

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: php artisan queue:work redis --queue=parsing --tries=3 --backoff=10,60,300 --sleep=3
    env_file: ./backend/.env
    volumes:
      - storage-data:/var/www/html/storage
    depends_on: [mysql, redis]
    networks: [app-net]
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: yandex_reviews
      MYSQL_USER: yandex_reviews
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks: [app-net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks: [app-net]
    restart: unless-stopped

networks:
  app-net:
  caddy-net:
    external: true
    name: app_default

volumes:
  db-data:
  redis-data:
  storage-data:
